<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Verimots — Connexion</title>
  <meta name="theme-color" content="#142018" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #142018; color: #f4efe4; font-family: system-ui, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 48px 20px; text-align: center; }
    h1 { font-size: 22px; letter-spacing: 0.04em; }
    p { color: #b7c4b8; line-height: 1.45; }
    .box { margin: 28px 0; display: flex; justify-content: center; }
    .ok { color: #3dce8a; }
    .err { color: #f07171; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>Verimots</h1>
    <p id="msg">Connecte-toi avec Google pour le classement, puis reviens dans l’application.</p>
    <div class="box" id="google-btn"></div>
    <p id="status"></p>
  </main>
  <script>
    const CLIENT = '617674779621-vu2iv3rjfcs08nrf5m6apn2ivnh9rim7.apps.googleusercontent.com'
    const en = new URLSearchParams(location.search).get('lang') === 'en'
    if (en) {
      document.documentElement.lang = 'en'
      document.getElementById('msg').textContent = 'Sign in with Google for the daily board, then return to the app.'
    }
    function sendToApp(token) {
      const q = 'token=' + encodeURIComponent(token)
      location.href = 'verimots://auth?' + q
      setTimeout(() => { location.replace('/auth-android-done.html?' + q + (en ? '&lang=en' : '')) }, 500)
    }
    window.onload = () => {
      if (!window.google?.accounts?.id) {
        document.getElementById('status').textContent = en ? 'Google Sign-In failed to load.' : 'Impossible de charger Google.'
        document.getElementById('status').className = 'err'
        return
      }
      google.accounts.id.initialize({
        client_id: CLIENT,
        callback: async (response) => {
          document.getElementById('status').textContent = en ? 'Signing in…' : 'Connexion…'
          try {
            const res = await fetch('/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ idToken: response.credential }),
            })
            const data = await res.json()
            if (data?.ok && data.sessionToken) sendToApp(data.sessionToken)
            else throw new Error(data?.error || 'auth_failed')
          } catch (err) {
            document.getElementById('status').textContent = en ? 'Sign-in failed.' : 'Échec de la connexion.'
            document.getElementById('status').className = 'err'
          }
        },
      })
      google.accounts.id.renderButton(document.getElementById('google-btn'), {
        theme: 'filled_blue',
        size: 'large',
        text: 'signin_with',
        locale: en ? 'en' : 'fr',
      })
    }
  </script>
</body>
</html>
