<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verimots — Connecté</title>
  <meta name="theme-color" content="#142018" />
  <style>
    html, body { margin: 0; background: #142018; color: #f4efe4; font-family: system-ui, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 48px 20px; text-align: center; }
    p { color: #b7c4b8; line-height: 1.45; }
    a { color: #e8c56b; }
  </style>
</head>
<body>
  <main>
    <h1>Verimots</h1>
    <p id="msg">Tu es connecté. Reviens dans l’application.</p>
    <p><a id="open" href="verimots://auth">Ouvrir Verimots</a></p>
  </main>
  <script>
    const q = location.search
    const en = new URLSearchParams(q).get('lang') === 'en'
    const token = new URLSearchParams(q).get('token') || ''
    if (en) {
      document.documentElement.lang = 'en'
      document.getElementById('msg').textContent = 'You are signed in. Return to the app.'
      document.getElementById('open').textContent = 'Open Verimots'
    }
    if (token) document.getElementById('open').href = 'verimots://auth?token=' + encodeURIComponent(token)
  </script>
</body>
</html>
