plugins {
    id "com.android.application"
}

def keystoreFile = file("${System.getProperty('user.home')}/.config/aiconglomerate/ods9.keystore")
def buildTime = new Date().format("yyyy-MM-dd HH:mm", TimeZone.getTimeZone("Europe/Paris"))

android {
    namespace "cc.pfa87.ods9"
    compileSdk 36

    defaultConfig {
        applicationId "cc.pfa87.verimots"
        minSdk 26
        targetSdk 36
        versionCode 59
        versionName "3.39"
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress += "gz"
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("ODS9_KEYSTORE_PASS") ?: "ods9pfa87"
                keyAlias "ods9"
                keyPassword System.getenv("ODS9_KEY_PASS") ?: "ods9pfa87"
            }
        }
    }

    buildTypes {
        release {
            // R8: Play Console flagged "App optimisation: Low" without it.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
