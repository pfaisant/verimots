<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8" />
<link rel="stylesheet" href="shot.css" />
</head><body>
<div class="tablet7">
  <div class="top">
    <div class="mark">V</div>
    <div class="brand"><h1>Verimots</h1><p>Communautaire</p></div>
    <div class="live">400 412 mots · hors ligne</div>
  </div>
  <div class="stage">
    <div class="row" style="justify-content:space-between">
      <div class="kicker">Défi du jour</div>
      <div class="chip">Compétition</div>
    </div>
    <div class="tiles" style="justify-content:center;margin:36px 0">
      <div class="tile lg">S</div><div class="tile lg">O</div><div class="tile lg">L</div>
      <div class="tile lg">I</div><div class="tile lg">E</div><div class="tile lg">R</div>
      <div class="tile lg">?</div>
    </div>
    <div class="row">
      <div class="input gold" style="flex:1">SOLIER</div>
      <div class="btn">✓</div>
    </div>
    <div class="card">
      <div class="score-card">
        <div class="pct">92</div>
        <div>
          <div class="break">SOLAIRE</div>
          <div class="vs">Mieux que 92 % des joueurs</div>
        </div>
      </div>
    </div>
  </div>
  <div class="dock">
    <div class="tab">✓<small>Vérifier</small></div>
    <div class="tab on">◈<small>Défi</small></div>
    <div class="tab">i<small>Infos</small></div>
  </div>
</div>
</body></html>
