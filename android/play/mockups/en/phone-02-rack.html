<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../shot.css" />
</head><body>
<div class="phone">
  <div class="top">
    <div class="mark">V</div>
    <div class="brand"><h1>Verimots</h1><p>Community</p></div>
    <div class="live">400,412 words</div>
  </div>
  <div class="stage">
    <div class="input gold">AERTIN?</div>
    <div class="tiles" style="margin-top:18px">
      <div class="tile sm">A</div><div class="tile sm">E</div><div class="tile sm">R</div>
      <div class="tile sm">T</div><div class="tile sm">I</div><div class="tile sm">N</div>
      <div class="tile sm">?</div>
    </div>
    <div class="card" style="margin-top:20px;padding:28px 32px">
      <div class="kicker">Rack</div>
      <div class="title">What can you play?</div>
      <div class="match">ENTRAIT <span>7 · bingo</span></div>
      <div class="match">NITRAIE <span>7 · bingo</span></div>
      <div class="match">RETINAI <span>7</span></div>
      <div class="match">TARINE <span>6</span></div>
      <div class="match">TRAIN <span>5</span></div>
    </div>
  </div>
  <div class="dock">
    <div class="tab on">✓<small>Check</small></div>
    <div class="tab">◈<small>Challenge</small></div>
    <div class="tab">i<small>About</small></div>
  </div>
</div>
</body></html>
