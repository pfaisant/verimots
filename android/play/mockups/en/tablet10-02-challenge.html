<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../shot.css" />
</head><body>
<div class="tablet10">
  <div class="top">
    <div class="mark">V</div>
    <div class="brand"><h1>Verimots</h1><p>Community</p></div>
    <div class="live">400,412 words · offline</div>
  </div>
  <div class="wide">
    <div class="stage">
      <div class="row" style="justify-content:space-between">
        <div class="kicker">Daily challenge</div>
        <div class="chip">Competition</div>
      </div>
      <div class="tiles" style="justify-content:center;margin:40px 0">
        <div class="tile lg">S</div><div class="tile lg">O</div><div class="tile lg">L</div>
        <div class="tile lg">I</div><div class="tile lg">E</div><div class="tile lg">R</div>
        <div class="tile lg">?</div>
      </div>
      <div class="row">
        <div class="input gold" style="flex:1">SOLIER</div>
        <div class="btn">✓</div>
      </div>
    </div>
    <div class="stage">
      <div class="card score-card" style="margin-top:0">
        <div class="pct">92</div>
        <div>
          <div class="break">SOLAIRE</div>
          <div class="vs">Better than 92% of players</div>
        </div>
      </div>
      <div class="card">
        <div class="kicker">Today’s leaderboard</div>
        <div class="board-row"><b>1</b> Camille <span>100</span></div>
        <div class="board-row"><b>2</b> Marc <span>96</span></div>
        <div class="board-row"><b>3</b> Léa <span>92</span></div>
        <div class="board-row"><b>4</b> You <span>92</span></div>
        <div class="board-row"><b>5</b> Nina <span>84</span></div>
      </div>
    </div>
  </div>
  <div class="dock">
    <div class="tab">✓<small>Check</small></div>
    <div class="tab on">◈<small>Challenge</small></div>
    <div class="tab">i<small>About</small></div>
  </div>
</div>
</body></html>
