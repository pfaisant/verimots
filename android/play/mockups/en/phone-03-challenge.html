<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../shot.css" />
</head><body>
<div class="phone">
  <div class="top">
    <div class="mark">V</div>
    <div class="brand"><h1>Verimots</h1><p>Community</p></div>
    <div class="live">400,412 words</div>
  </div>
  <div class="stage">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <div class="kicker">Daily challenge</div>
      <div class="chip">Competition</div>
    </div>
    <div class="tiles" style="justify-content:center;margin:28px 0 32px">
      <div class="tile lg">S</div><div class="tile lg">O</div><div class="tile lg">L</div>
      <div class="tile lg">I</div><div class="tile lg">E</div><div class="tile lg">R</div>
      <div class="tile lg">?</div>
    </div>
    <div class="row">
      <div class="input gold" style="flex:1">SOLIER</div>
      <div class="btn">✓</div>
    </div>
    <p class="hint">Your word · 6 letters used</p>
    <div class="card">
      <div class="kicker">Bingo</div>
      <div class="title">Find the best word</div>
      <div class="body">Same rack for everyone today. First score counts in competition.</div>
    </div>
  </div>
  <div class="dock">
    <div class="tab">✓<small>Check</small></div>
    <div class="tab on">◈<small>Challenge</small></div>
    <div class="tab">i<small>About</small></div>
  </div>
</div>
</body></html>
