<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8" />
<link rel="stylesheet" href="shot.css" />
</head><body>
<div class="phone">
  <div class="top">
    <div class="mark">V</div>
    <div class="brand"><h1>Verimots</h1><p>Communautaire</p></div>
    <div class="live">400 412 mots</div>
  </div>
  <div class="stage">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <div class="kicker">Défi</div>
      <div class="chip">Compétition</div>
    </div>
    <div class="card score-card">
      <div class="pct">92</div>
      <div>
        <div class="break">SOLAIRE</div>
        <div class="vs">Mieux que 92 % des joueurs</div>
      </div>
    </div>
    <div class="card" style="margin-top:20px">
      <div class="kicker">Classement du jour</div>
      <div class="board-row"><b>1</b> Camille <span>100</span></div>
      <div class="board-row"><b>2</b> Marc <span>96</span></div>
      <div class="board-row"><b>3</b> Léa <span>92</span></div>
      <div class="board-row"><b>4</b> You <span>92</span></div>
      <div class="board-row"><b>5</b> Nina <span>84</span></div>
    </div>
  </div>
  <div class="dock">
    <div class="tab">✓<small>Vérifier</small></div>
    <div class="tab on">◈<small>Défi</small></div>
    <div class="tab">i<small>Infos</small></div>
  </div>
</div>
</body></html>
